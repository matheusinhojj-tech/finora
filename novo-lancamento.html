<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
        <link rel="stylesheet" href="assets/css/novo-lancamento.css">
        <title>Novo Lançamento</title>
    </head>
    <body>
        <div id="content">
            <section>
                <a href="index.html" type="novo-lançamento.html" class="btn btn-light">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Voltar
                </a>
                <img src="assets/img/logo.png" alt="Finora">
                <h1>Novo Lançamento</h1>
                <p>Registre uma entrada ou saída de dinheiro.</p>
                <br>
                <form onsubmit="salvar(event)">
                    <div class="field">
                        <div class="radio-title"><strong>O que deseja lançar?</strong></div>

                            <div class="radio-box">
                            <div class="radio-option">
                                <input type="radio" name="deseja" id="receita" value="R">
                                <label for="receita">Receita</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="deseja" id="despesa" value="D">
                                <label for="despesa">Despesa</label>
                            </div>
                        </div>
                    </div>
                    <div class="field">
                        <label for="descricao">Descrição</label>
                        <input 
                        id="descricao" 
                        type="text"
                        name="descricao"
                        class="input-text block"
                        placeholder="Ex.: Mercado do mês"
                        maxlength="30"
                        required
                        autofocus
                        >
                    </div>
                    <div class="field">
                        <label for="valor">Valor em R$</label>
                        <input 
                        id="valor" 
                        type="text" 
                        name="valor"
                        class="input-text block"
                        placeholder="Ex: 49,90"
                        maxlength="30"
                        required
                        autofocus
                        >
                    </div>

                    <div class="field">
                        <label for="data">Data</label>
                        <input 
                        id="data" 
                        type="date" 
                        name="data"
                        class="input-text block"
                        maxlength="30"
                        required
                        autofocus
                        >
                    </div>

                    <div class="field">
                        <label for="categoria">Categoria</label>
                        <select class="select-default block" name="categoria" id="categoria"></select>
                    </div>

                    <div class="field">
                        <label for="observacoes">Observações (opcional)</label>
                        <textarea
                            class="block"
                            name="observacoes" 
                            id="observacoes"
                            placeholder="Ex.: Pago no cartão ou débito"
                        ></textarea>
                    </div>
                    
                    <a href="#" type="novo-lançamento.html" class="btn btn-primary block">
                        Salvar lançamento
                    </a>
                    <a href="#" type="novo-lançamento.html" class="btn btn-outline block">
                        Cancelar
                    </a>

                </form>
            </section>
        </div>
        <script src="assets/js/novo-lancamento.js"></script>
    </body>
</html>
