<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="assets/css/index.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
        <link rel="stylesheet" href="assets/css/renda.css">
        <title>Alterar Renda</title>
    </head>
    <body>
        <div id="content">
            <main>
                <a href="index.html" class="btn btn-light">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Voltar
                </a>
                <img src="assets/img/logo.png" alt="finora">
                <section>
                    
                    <form onsubmit="atualizarRenda(event)">
                        <h1>Sua renda mudou?</h1>

                        <p>
                            Atulize sua renda mensal. Assim, mostramos quanto dela você ja gastou em cada mês do ano.
                        </p>
                        <input 
                            type="hidden" name="id">

                        <div class="field">
                            <label for="nome">Como podemos te chamar?</label>
                            <input
                                class="input-text block" 
                                type="text"
                                name="nome"
                                id="nome"
                                placeholder="Ex.: Tiago"
                                maxlength="30"
                                required
                                autofocus
                            >
                        </div>
                        <div class="field">
                            <label for="renda">Qual sua renda mensal?</label>
                            <input
                                class="input-text block" 
                                type="number"
                                name="renda"
                                id="renda"
                                placeholder="Ex.: 1.621,07"
                                required
                            >
                    
                        <button type="submit" class="btn btn-primary block">
                            <span class="material-symbols-outlined icon">edit_square</span>
                            Atualizar Renda
                        </button>
                    </form>
                </section>
            </main>
        </div>
        <script src="assets/js/renda.js"></script>
    </body>
</html>
