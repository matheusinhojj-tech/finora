<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"> 
        <link rel="stylesheet" href="assets/css/perfil.css">
        <title>Crie seu Perfil - Finora </title>
    </head>
    <body>
        <div id="content">
            <main>
                <a href="login.html" type="button" class="btn btn-light">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Login
                </a>

                <img src="assets/img/logo.png" alt="finora">

                <section>
                    <h1>Vamos Começar</h1>
                    <p>Crie seu Perfil e informe sua renda mensal. Assim, mostramos quanto dela você já gastou em cada mês do ano. </p>

                    <form> 
                        <div class="field">
                            <label for="nome">Como podemos te chamar?</label>
                            <input 
                                class="input-text block"
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Ex.: Giovanna"
                                required
                                maxlength="30"
                                autofocus
                            >
                        </div>

                        <div class="field">
                            <label for="email">Informe um E-mail</label>
                            <input 
                                class="input-text block"
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Ex.: usuario@email.com"
                                required
                                maxlength="100"
                            >
                        </div>
                        <div class="field">
                            <label for="senha">Cadastre sua senha</label>
                            <input 
                                class="input-text block"
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="&bull;&bull;&bull;&bull;"
                                required
                                minlength="4"
                                maxlength="8"
                            >
                        </div>
                        <div class="field">
                            <label for="renda">Qual sua renda mensal?</label>
                            <input 
                                class="input-text block"
                                type="number"
                                id="renda"
                                name="renda"
                                placeholder="Ex.: 1621.07"
                                required
                                minlength="4"
                                maxlength="8"
                            >
                        </div>

                        <button type="submit" class="btn btn-primary block">
                            <span class="material-symbols-outlined">done</span>
                            Começar agora
                        </button>
                        <button type="reset" class="btn btn-outline block">
                            <span class="material-symbols-outlined">close</span>
                            Cancelar
                        </button>

                    </form>
                </section>
            </main>
        </div>
    </body>
</html>
